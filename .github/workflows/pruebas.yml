# Ejecuta las pruebas automáticas en cada push y pull request
# (plan de pruebas del SQA, sección 5).
name: pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest-cov pip-audit
      - run: python -m pytest --cov=. --cov-fail-under=80
        env:
          ASILO_BD: memoria
      - run: pip-audit -r requirements.txt
